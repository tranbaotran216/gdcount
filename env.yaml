name: gdcount
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch::pytorch=2.3.1
  - pytorch::torchvision=0.18.1
  - pytorch::torchaudio=2.3.1
  - pytorch-cuda=12.1
  - pip
  - pyyaml
  - tqdm
  - pillow
  - gitpython
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - numpy==2.2.6
      - scipy==1.15.3
      - pandas==2.3.3
      - matplotlib==3.10.8
      - opencv-python==4.12.0.88
      - streamlit==1.52.1
      - streamlit-drawable-canvas-fix
      - transformers==4.57.3
      - tokenizers==0.22.1
      - huggingface-hub==0.36.0
      - timm==1.0.22
      - einops==0.8.1
      - pycocotools==2.0.10
      - supervision==0.27.0
      - yapf==0.43.0